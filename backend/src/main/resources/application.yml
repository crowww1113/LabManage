spring:
  datasource:
    url: jdbc:h2:file:E:/作业/交互项目实战/LabManage/LabManage/data/school_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

  # 关闭JMX，彻底解决日志刷屏
  jmx:
    enabled: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

server:
  port: 8083
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    sun.rmi: OFF
    javax.management: OFF
