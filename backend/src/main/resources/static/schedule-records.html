<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>排课记录管理</title>
    <script src="api-fetch.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; padding: 20px; background: #fff; color: #333; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; min-width: 180px; }
        label { font-weight: 600; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        textarea { min-height: 80px; resize: vertical; }
        .btn { padding: 9px 16px; border: none; border-radius: 4px; cursor: pointer; background: #007bff; color: #fff; font-size: 14px; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px 6px; text-align: left; vertical-align: top; }
        th { background: #f5f5f5; white-space: nowrap; }
        tr:hover { background: #fafafa; }
        .actions { display: flex; flex-wrap: wrap; gap: 6px; }
        .status { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; background: #eef2f7; }
        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-APPROVED { background: #d4edda; color: #155724; }
        .status-REJECTED { background: #f8d7da; color: #721c24; }
        .status-CANCELLED { background: #e2e3e5; color: #383d41; }
        .status-IN_USE { background: #cce5ff; color: #004085; }
        .status-COMPLETED { background: #d4edda; color: #155724; }
        .empty { padding: 24px; text-align: center; color: #666; border: 1px dashed #ddd; border-radius: 4px; }
        .modal { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; }
        .modal-content { background: #fff; width: 90%; max-width: 500px; margin: 5% auto; border-radius: 8px; padding: 24px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; font-size: 20px; }
        .close { font-size: 28px; cursor: pointer; color: #999; }
        .close:hover { color: #333; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .detail-item { background: #f8f9fa; border-radius: 4px; padding: 10px; }
        .detail-item strong { display: block; margin-bottom: 4px; font-size: 12px; color: #666; }
        .detail-item span { font-size: 14px; }

        /* 修改模态框样式 */
        .edit-week-grid { display: flex; flex-wrap: wrap; gap: 4px; }
        .edit-week-grid .week-chip { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 32px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .15s; background: #fff; user-select: none; }
        .edit-week-grid .week-chip:hover { border-color: #91caff; }
        .edit-week-grid .week-chip.checked { background: #1677ff; color: #fff; border-color: #1677ff; }
        .edit-slot-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .edit-slot-chips .slot-chip { display: inline-flex; align-items: center; padding: 6px 14px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all .15s; background: #fff; user-select: none; }
        .edit-slot-chips .slot-chip:hover { border-color: #91caff; }
        .edit-slot-chips .slot-chip.checked { background: #1677ff; color: #fff; border-color: #1677ff; }
        .edit-conflict-hint { padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; text-align: center; display: none; }
        .edit-week-quick-btns { display: flex; gap: 8px; margin-bottom: 10px; }
        .edit-week-quick-btns button { padding: 4px 14px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; transition: all .15s; }
        .edit-week-quick-btns button:hover { border-color: #1677ff; color: #1677ff; }
        .edit-section { margin-bottom: 18px; }
        .edit-section-title { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body>
<h1>排课记录管理</h1>

<div class="toolbar">
    <div class="form-group">
        <label>学期</label>
        <select id="filterTermId" onchange="loadRecords()">
            <option value="">全部学期</option>
        </select>
    </div>
    <div class="form-group">
        <label>状态</label>
        <select id="filterStatus" onchange="loadRecords()">
            <option value="">全部</option>
            <option value="PENDING">待审批</option>
            <option value="APPROVED">已通过</option>
            <option value="REJECTED">已驳回</option>
            <option value="CANCELLED">已取消</option>
            <option value="IN_USE">使用中</option>
            <option value="COMPLETED">已完成</option>
        </select>
    </div>
    <div class="form-group">
        <label>来源</label>
        <select id="filterSource" onchange="loadRecords()">
            <option value="">全部</option>
            <option value="booking">集中排课</option>
            <option value="individual">临时预约</option>
        </select>
    </div>
    <button class="btn" onclick="loadRecords()">刷新</button>
</div>

<div id="tableWrapper"></div>

<!-- 取消原因弹窗 -->
<div id="cancelModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>取消排课</h2>
            <span class="close" onclick="closeCancelModal()">&times;</span>
        </div>
        <div class="form-group">
            <label>取消原因</label>
            <textarea id="cancelReason" placeholder="请输入取消原因"></textarea>
        </div>
        <input id="cancelId" type="hidden">
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeCancelModal()">返回</button>
            <button class="btn btn-danger" onclick="confirmCancel()">确认取消</button>
        </div>
    </div>
</div>

<!-- 修改排课模态框 -->
<div id="editModal" class="modal">
    <div class="modal-content" style="max-width:600px;">
        <div class="modal-header">
            <h2>修改排课设置</h2>
            <span class="close" onclick="closeEditModal()">&times;</span>
        </div>
        <div id="editFormBody">
            <div class="edit-section">
                <div class="edit-section-title">周次选择</div>
                <div class="edit-week-quick-btns">
                    <button onclick="editQuickSelect('odd')">单周</button>
                    <button onclick="editQuickSelect('even')">双周</button>
                    <button onclick="editQuickSelect('all')">全选</button>
                    <button onclick="editQuickSelect('clear')">清空</button>
                </div>
                <div class="edit-week-grid" id="editWeekGrid"></div>
            </div>
            <div class="edit-section">
                <div class="edit-section-title">时间选择</div>
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;">
                    <span style="font-size:13px;font-weight:500;">星期</span>
                    <select id="editDayOfWeek" style="padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;" onchange="checkEditConflict()">
                        <option value="1">周一</option><option value="2">周二</option>
                        <option value="3">周三</option><option value="4">周四</option>
                        <option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
                    </select>
                </div>
                <div style="font-size:13px;font-weight:500;margin-bottom:8px;">节次</div>
                <div class="edit-slot-chips" id="editSlotChips"></div>
            </div>
            <div class="edit-section">
                <div class="edit-section-title">实验室选择</div>
                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                    <div>
                        <span style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">楼栋</span>
                        <input id="editBuilding" style="padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:160px;" placeholder="如：明德楼" oninput="checkEditConflict()">
                    </div>
                    <div>
                        <span style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">房间</span>
                        <input id="editRoom" style="padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:160px;" placeholder="如：B201" onchange="checkEditConflict()">
                    </div>
                </div>
            </div>
            <div id="editConflictHint" class="edit-conflict-hint"></div>
        </div>
        <input id="editReservationId" type="hidden">
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
            <button class="btn btn-success" id="btnEditSubmit" onclick="submitEdit()">保存修改</button>
        </div>
    </div>
</div>
<script>
    const loginUser = JSON.parse(localStorage.getItem('loginUser') || '{}');
    const operatorId = loginUser.id;

    // ===== 修改排课相关状态 =====
    let allTimeSlots = [];
    let editSelectedWeeks = [];
    let editSelectedSlotIds = [];
    let editTermId = null;

    // ===== 修改排课：加载节次数据 =====
    (async function loadTimeSlots() {
        try {
            allTimeSlots = await apiFetch('/api/time-slots');
        } catch (e) { /* 静默失败 */ }
    })();

    function renderEditWeekGrid() {
        const grid = document.getElementById('editWeekGrid');
        grid.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
            const chip = document.createElement('span');
            chip.className = 'week-chip';
            chip.textContent = i;
            chip.dataset.week = i;
            chip.onclick = function () { editToggleWeek(this, i); };
            grid.appendChild(chip);
        }
    }

    function editToggleWeek(el, week) {
        el.classList.toggle('checked');
        if (el.classList.contains('checked')) {
            if (!editSelectedWeeks.includes(week)) editSelectedWeeks.push(week);
        } else {
            editSelectedWeeks = editSelectedWeeks.filter(w => w !== week);
        }
        editSelectedWeeks.sort((a, b) => a - b);
        checkEditConflict();
    }

    function editQuickSelect(type) {
        const chips = document.querySelectorAll('#editWeekGrid .week-chip');
        editSelectedWeeks = [];
        chips.forEach(chip => {
            const w = parseInt(chip.dataset.week);
            let match = false;
            if (type === 'all') match = true;
            else if (type === 'odd') match = w % 2 === 1;
            else if (type === 'even') match = w % 2 === 0;
            if (match) {
                chip.classList.add('checked');
                editSelectedWeeks.push(w);
            } else {
                chip.classList.remove('checked');
            }
        });
        checkEditConflict();
    }

    function renderEditSlotChips() {
        const container = document.getElementById('editSlotChips');
        container.innerHTML = allTimeSlots.map(s => {
            const st = (s.startTime || '').substring(0, 5);
            const et = (s.endTime || '').substring(0, 5);
            return `<span class="slot-chip" data-id="${s.id}" onclick="editToggleSlot(this,${s.id})">${s.slotName}<br><small>${st}-${et}</small></span>`;
        }).join('');
    }

    function editToggleSlot(el, slotId) {
        el.classList.toggle('checked');
        if (el.classList.contains('checked')) {
            if (!editSelectedSlotIds.includes(slotId)) editSelectedSlotIds.push(slotId);
        } else {
            editSelectedSlotIds = editSelectedSlotIds.filter(id => id !== slotId);
        }
        checkEditConflict();
    }

    function checkEditConflict() {
        const hint = document.getElementById('editConflictHint');
        const btn = document.getElementById('btnEditSubmit');
        const buildingName = document.getElementById('editBuilding').value.trim();
        const roomNumber = document.getElementById('editRoom').value.trim();
        const dayOfWeek = parseInt(document.getElementById('editDayOfWeek').value);
        const editId = document.getElementById('editReservationId').value;

        if (!editTermId || !buildingName || editSelectedWeeks.length === 0 || !dayOfWeek || editSelectedSlotIds.length === 0) {
            hint.style.display = 'none';
            btn.disabled = false;
            return;
        }

        const params = new URLSearchParams();
        params.append('termId', editTermId);
        params.append('dayOfWeek', dayOfWeek);
        editSelectedWeeks.forEach(w => params.append('weeks', w));
        editSelectedSlotIds.forEach(s => params.append('timeSlotIds', s));
        params.append('buildingName', buildingName);
        if (editId) params.append('excludeReservationId', editId);

        hint.style.display = 'block';
        hint.style.background = '#f8f9fa';
        hint.style.color = '#666';
        hint.textContent = '⏳ 正在检测冲突...';

        apiFetch('/api/schedule-reservations/labs/availability?' + params.toString())
            .then(results => {
                if (!results || results.length === 0) {
                    hint.innerHTML = '⚠️ 该楼栋暂无实验室数据';
                    hint.style.background = '#fff3cd';
                    hint.style.color = '#856404';
                    btn.disabled = true;
                    return;
                }
                if (roomNumber) {
                    const match = results.find(r => r.roomNumber === roomNumber);
                    if (match) {
                        if (match.available) {
                            hint.innerHTML = '✅ 该时段实验室可用';
                            hint.style.background = '#d4edda';
                            hint.style.color = '#155724';
                            btn.disabled = false;
                        } else {
                            const c = match.conflicts && match.conflicts[0];
                            const cInfo = c ? `（${c.courseName || ''}/${c.teacherName || ''}/第${c.weekNo}周 ${c.timeSlotName || ''}）` : '';
                            hint.innerHTML = '⚠️ 该时段此实验室已被占用！' + cInfo;
                            hint.style.background = '#f8d7da';
                            hint.style.color = '#721c24';
                            btn.disabled = true;
                        }
                    } else {
                        hint.innerHTML = '✅ 该房间未发现冲突记录';
                        hint.style.background = '#d4edda';
                        hint.style.color = '#155724';
                        btn.disabled = false;
                    }
                } else {
                    hint.textContent = '📋 请输入房间号进行精确检测';
                    hint.style.background = '#e7f3ff';
                    hint.style.color = '#004085';
                    btn.disabled = true;
                }
            })
            .catch(() => {
                hint.style.display = 'none';
                btn.disabled = false;
            });
    }

    async function openEditModal(id) {
        try {
            const item = await apiFetch(`/api/schedule-reservations/${id}`);
            document.getElementById('editReservationId').value = item.id;
            editTermId = item.termId;

            // 填充星期
            document.getElementById('editDayOfWeek').value = item.dayOfWeek || 1;

            // 填充楼栋和房间
            document.getElementById('editBuilding').value = item.buildingName || '';
            document.getElementById('editRoom').value = item.roomNumber || '';

            // 渲染周次网格并选中当前周
            renderEditWeekGrid();
            editSelectedWeeks = [];
            if (item.weekNo) {
                editToggleWeek(document.querySelector(`#editWeekGrid .week-chip[data-week="${item.weekNo}"]`), item.weekNo);
            }

            // 渲染节次并选中当前节次
            renderEditSlotChips();
            editSelectedSlotIds = [];
            if (item.timeSlotId) {
                const slotEl = document.querySelector(`#editSlotChips .slot-chip[data-id="${item.timeSlotId}"]`);
                if (slotEl) editToggleSlot(slotEl, item.timeSlotId);
            }

            // 清空冲突提示
            document.getElementById('editConflictHint').style.display = 'none';
            document.getElementById('btnEditSubmit').disabled = false;

            document.getElementById('editModal').style.display = 'block';

            // 加载完毕后触发一次冲突检测
            setTimeout(checkEditConflict, 300);
        } catch (error) {
            alert('加载预约数据失败：' + error.message);
        }
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function submitEdit() {
        const id = document.getElementById('editReservationId').value;
        const dayOfWeek = parseInt(document.getElementById('editDayOfWeek').value);
        const buildingName = document.getElementById('editBuilding').value.trim();
        const roomNumber = document.getElementById('editRoom').value.trim();

        if (editSelectedWeeks.length === 0) { alert('请选择周次'); return; }
        if (editSelectedSlotIds.length === 0) { alert('请选择节次'); return; }
        if (!buildingName) { alert('请输入楼栋'); return; }
        if (!roomNumber) { alert('请输入房间号'); return; }

        const btn = document.getElementById('btnEditSubmit');
        btn.disabled = true;
        btn.textContent = '保存中...';

        try {
            await apiFetch(`/api/schedule-reservations/${id}`, {
                method: 'PUT',
                body: JSON.stringify({
                    weeks: editSelectedWeeks,
                    dayOfWeek: dayOfWeek,
                    timeSlotIds: editSelectedSlotIds,
                    buildingName: buildingName,
                    roomNumber: roomNumber
                })
            });
            alert('修改成功');
            closeEditModal();
            await loadRecords();
        } catch (error) {
            alert('修改失败：' + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '保存修改';
        }
    }

    // 点击模态框外部关闭
    window.onclick = function (event) {
        if (event.target === document.getElementById('cancelModal')) {
            closeCancelModal();
        }
        if (event.target === document.getElementById('editModal')) {
            closeEditModal();
        }
    };

    function statusText(status) {
        const map = {
            PENDING: '待审批', APPROVED: '已通过', REJECTED: '已驳回',
            CANCELLED: '已取消', IN_USE: '使用中', COMPLETED: '已完成'
        };
        return map[status] || status || '-';
    }

    function formatDay(dayOfWeek) {
        const map = { 1: '周一', 2: '周二', 3: '周三', 4: '周四', 5: '周五', 6: '周六', 7: '周日' };
        return dayOfWeek ? map[dayOfWeek] || dayOfWeek : '-';
    }

    function groupByBookingId(list) {
        const groups = new Map();
        const individuals = [];
        list.forEach(item => {
            if (item.bookingId) {
                if (!groups.has(item.bookingId)) {
                    groups.set(item.bookingId, { items: [], bookingId: item.bookingId });
                }
                groups.get(item.bookingId).items.push(item);
            } else {
                individuals.push(item);
            }
        });
        const merged = [];
        groups.forEach(group => {
            const first = group.items[0];
            const weeks = [...new Set(group.items.map(i => i.weekNo))].sort((a, b) => a - b);
            const allSame = group.items.every(i =>
                i.buildingName === first.buildingName && i.roomNumber === first.roomNumber
                && i.dayOfWeek === first.dayOfWeek && i.status === first.status);
            if (group.items.length > 1 && allSame) {
                merged.push({
                    isGroup: true,
                    projectName: first.projectName,
                    projectCategory: first.projectCategory,
                    projectLeader: first.projectLeader,
                    contactPhone: first.contactPhone,
                    dayOfWeek: first.dayOfWeek,
                    buildingName: first.buildingName,
                    roomNumber: first.roomNumber,
                    studentCount: first.studentCount,
                    duration: first.duration,
                    status: first.status,
                    weekRangeText: weeks.length === 1 ? '第' + weeks[0] + '周'
                        : '第' + weeks[0] + '-' + weeks[weeks.length - 1] + '周',
                    items: group.items
                });
            } else {
                group.items.forEach(i => individuals.push(i));
            }
        });
        return { merged, individuals };
    }

    function renderTable(list) {
        const wrapper = document.getElementById('tableWrapper');
        if (!Array.isArray(list) || list.length === 0) {
            wrapper.innerHTML = '<div class="empty">暂无排课记录</div>';
            return;
        }

        const { merged, individuals } = groupByBookingId(list);

        wrapper.innerHTML = `
            <table>
                <thead><tr>
                    <th>项目名称</th><th>项目类别</th><th>项目负责人</th>
                    <th>周次</th><th>星期</th><th>节次</th>
                    <th>楼栋</th><th>房间</th><th>学生数</th>
                    <th>预计时长</th><th>状态</th><th>操作</th>
                </tr></thead>
                <tbody>
                    ${merged.map(group => `
                        <tr style="background:#f0f9ff;">
                            <td title="${group.projectName || ''}"><span style="background:#e6f7ff;color:#0070c0;padding:2px 6px;border-radius:4px;font-size:11px;">批次</span> ${(group.projectName || '-').substring(0, 12)}${(group.projectName || '').length > 12 ? '...' : ''}</td>
                            <td>${group.projectCategory || '-'}</td>
                            <td>${group.projectLeader || '-'}</td>
                            <td>${group.weekRangeText}</td>
                            <td>${formatDay(group.dayOfWeek)}</td>
                            <td>${group.items[0].timeSlotId ?? '-'}</td>
                            <td>${group.buildingName || '-'}</td>
                            <td>${group.roomNumber || '-'}</td>
                            <td>${group.studentCount ?? '-'}</td>
                            <td>${group.duration ? group.duration + '小时' : '-'}</td>
                            <td><span class="status status-${group.status || ''}">${statusText(group.status)}</span></td>
                            <td><span style="color:#999;font-size:12px;">批次记录</span></td>
                        </tr>
                    `).join('')}
                    ${individuals.map(item => `
                        <tr>
                            <td title="${item.projectName || ''}">${(item.projectName || '-').substring(0, 12)}${(item.projectName || '').length > 12 ? '...' : ''}</td>
                            <td>${item.projectCategory || '-'}</td>
                            <td>${item.projectLeader || '-'}</td>
                            <td>第${item.weekNo ?? '-'}周</td>
                            <td>${formatDay(item.dayOfWeek)}</td>
                            <td>${item.timeSlotId ?? '-'}</td>
                            <td>${item.buildingName || '-'}</td>
                            <td>${item.roomNumber || '-'}</td>
                            <td>${item.studentCount ?? '-'}</td>
                            <td>${item.duration ? item.duration + '小时' : '-'}</td>
                            <td><span class="status status-${item.status || ''}">${statusText(item.status)}</span></td>
                            <td>
                                <div class="actions">
                                    ${(item.status !== 'CANCELLED' && item.status !== 'COMPLETED') ? `<button class="btn btn-danger" onclick="openCancelModal(${item.id})">取消排课</button>` : ''}
                                    <button class="btn btn-success" onclick="openEditModal(${item.id})" style="font-size:12px;padding:5px 10px;">修改</button>
                                    <button class="btn btn-secondary" onclick="viewDetail(${item.id})">详情</button>
                                </div>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
    }

    async function loadRecords() {
        try {
            const params = new URLSearchParams();
            const termId = document.getElementById('filterTermId').value;
            const status = document.getElementById('filterStatus').value;
            const source = document.getElementById('filterSource').value;
            if (termId) params.set('termId', termId);
            const list = await apiFetch(`/api/schedule-reservations?${params.toString()}`);
            let filtered = status ? list.filter(r => r.status === status) : list;
            if (source === 'booking') {
                filtered = filtered.filter(r => r.bookingId != null);
            } else if (source === 'individual') {
                filtered = filtered.filter(r => r.bookingId == null);
            }
            renderTable(filtered);
        } catch (error) {
            alert('加载排课记录失败：' + error.message);
        }
    }

    function openCancelModal(id) {
        document.getElementById('cancelId').value = id;
        document.getElementById('cancelReason').value = '';
        document.getElementById('cancelModal').style.display = 'block';
    }

    function closeCancelModal() {
        document.getElementById('cancelModal').style.display = 'none';
    }

    async function confirmCancel() {
        const id = document.getElementById('cancelId').value;
        const reason = document.getElementById('cancelReason').value.trim() || null;
        try {
            await apiFetch(`/api/schedule-reservations/${id}/cancel`, {
                method: 'POST',
                body: JSON.stringify({ operatorId: operatorId || 0, reason })
            });
            alert('取消成功');
            closeCancelModal();
            await loadRecords();
        } catch (error) {
            alert('取消失败：' + error.message);
        }
    }

    async function deleteRecord(id) {
        if (!confirm('确定删除此排课记录？此操作不可撤销。')) return;
        try {
            await apiFetch(`/api/schedule-reservations/${id}`, { method: 'DELETE' });
            alert('删除成功');
            await loadRecords();
        } catch (error) {
            alert('删除失败：' + error.message);
        }
    }

    async function viewDetail(id) {
        try {
            const item = await apiFetch(`/api/schedule-reservations/${id}`);
            const rows = [
                ['预约单号', item.reservationNo], ['所属批次', item.bookingId ? '批次ID: ' + item.bookingId : '独立预约'],
                ['学期ID', item.termId],
                ['开展项目名称', item.projectName], ['项目类别', item.projectCategory],
                ['项目负责人', item.projectLeader], ['联系电话', item.contactPhone],
                ['年级', item.grade], ['班级', item.className],
                ['参与人数', item.participantCount], ['预计使用时长', item.duration ? item.duration + '小时' : '-'],
                ['楼栋', item.buildingName], ['房间号', item.roomNumber],
                ['使用日期', item.useDate], ['周次', '第' + item.weekNo + '周'],
                ['星期', formatDay(item.dayOfWeek)], ['节次ID', item.timeSlotId],
                ['开始时间', item.startTime], ['结束时间', item.endTime],
                ['学生人数', item.studentCount], ['实验组数', item.groupCount],
                ['每组人数', item.studentsPerGroup], ['实验内容', item.experimentContent],
                ['备注', item.remark], ['状态', statusText(item.status)]
            ];
            const detailHtml = rows.map(([label, value]) => `
                <div class="detail-item"><strong>${label}</strong><span>${value ?? '-'}</span></div>
            `).join('');
            const detailDiv = document.createElement('div');
            detailDiv.className = 'modal';
            detailDiv.style.display = 'block';
            detailDiv.innerHTML = `
                <div class="modal-content" style="max-width:700px;">
                    <div class="modal-header">
                        <h2>排课详情</h2>
                        <span class="close" onclick="this.closest('.modal').remove()">&times;</span>
                    </div>
                    <div class="detail-grid">${detailHtml}</div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">关闭</button>
                    </div>
                </div>`;
            document.body.appendChild(detailDiv);
        } catch (error) {
            alert('加载详情失败：' + error.message);
        }
    }

    // 加载学期列表
    (async function init() {
        try {
            const terms = await apiFetch('/api/terms');
            const termSelect = document.getElementById('filterTermId');
            if (terms && terms.length > 0) {
                const today = new Date().toISOString().split('T')[0];
                termSelect.innerHTML = '<option value="">全部学期</option>' + terms.map(term => {
                    const selected = today >= term.startDate && today <= term.endDate ? ' selected' : '';
                    return `<option value="${term.id}"${selected}>${term.termName}</option>`;
                }).join('');
            }
        } catch (e) { /* 学期加载失败不影响主功能 */ }
        loadRecords();
    })();
</script>
</body>
</html>
