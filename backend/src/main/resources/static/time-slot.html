<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>节次设置</title>
    <style>
        :root {--bg:#eff2f5;--panel:rgba(255,255,255,0.92);--ink:#181816;--text:#26241f;--muted:#6f6a62;--line:rgba(37,32,27,0.1);--accent:#3f5a52;--radius:20px;--radius-sm:12px;}
        *{box-sizing:border-box;}body{margin:0;background:linear-gradient(180deg,#f8f6f2 0%,#f1eee8 100%);font-family:Inter,sans-serif;}
        .layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
        .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:30px 20px;}
        .main{padding:40px;}
        .card{background:var(--panel);border-radius:var(--radius);padding:24px;}
        table{width:100%;border-collapse:collapse;}
        th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);}
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div style="padding:20px;background:rgba(63,90,82,.06);border-radius:20px;text-align:center;margin-bottom:30px;">
            <h1 style="font-size:18px;">实验室管理系统</h1>
        </div>
        <button onclick="go('/')" style="width:100%;padding:10px;border-radius:12px;background:transparent;border:none;cursor:pointer;">← 返回</button>
    </aside>
    <main class="main">
        <h2>节次时间设置</h2>
        <div class="card">
            <table>
                <thead><tr><th>节次</th><th>开始时间</th><th>结束时间</th></tr></thead>
                <tbody>
                <tr><td>1-2节</td><td>08:00</td><td>09:40</td></tr>
                <tr><td>3-4节</td><td>10:00</td><td>11:40</td></tr>
                <tr><td>5-6节</td><td>14:00</td><td>15:40</td></tr>
                <tr><td>7-8节</td><td>16:00</td><td>17:40</td></tr>
                <tr><td>9-10节</td><td>19:00</td><td>20:40</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script>function go(u){location.href=u;}</script>
</body>
</html>
